name: Publish Steamon Trainers

# Builds the datapack zip, checks it, refreshes the stable "latest" GitHub release and publishes the version to Modrinth.
# CurseForge is published by hand, nothing here touches it.
#
# Needs, in the repository settings:
#   secrets    MODRINTH_TOKEN
#   variables  MODRINTH_PROJECT_ID (id or slug of the Modrinth project)
on:
  push:
    tags:
      # Tag format: v<version>-<channel>  (channel optional, defaults to alpha)
      #   channel = alpha | beta | release
      # e.g. v2.0.0-alpha, v2.0.0-beta, v2.0.0-release, or plain v2.0.0
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 2.0.0)'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options: [alpha, beta, release]
        default: alpha

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect version and channel
        id: meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            CHANNEL="${{ inputs.channel }}"
          else
            TAG="${GITHUB_REF_NAME}"        # e.g. v2.0.0-beta
            REST="${TAG#v}"
            if [[ "$REST" == *-alpha ]]; then CHANNEL=alpha; VERSION="${REST%-alpha}"
            elif [[ "$REST" == *-beta ]]; then CHANNEL=beta; VERSION="${REST%-beta}"
            elif [[ "$REST" == *-release ]]; then CHANNEL=release; VERSION="${REST%-release}"
            else CHANNEL=alpha; VERSION="$REST"; fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Detected: version=$VERSION channel=$CHANNEL"

      - name: Validate all JSON files
        run: |
          set -euo pipefail
          FAIL=0
          while IFS= read -r -d '' f; do
            if ! python3 -m json.tool "$f" > /dev/null; then
              echo "[FAIL] Invalid JSON: $f"
              FAIL=1
            fi
          done < <(find data assets -name "*.json" -print0)
          if ! python3 -m json.tool pack.mcmeta > /dev/null; then
            echo "[FAIL] Invalid JSON: pack.mcmeta"
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "[ok] All JSON files are valid."

      - name: Validate pack.mcmeta, files and trainer graphs
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import json, os, sys

          with open('pack.mcmeta', encoding='utf-8') as f:
              meta = json.load(f)
          fmt = meta.get('pack', {}).get('pack_format')
          if fmt != 48:
              sys.exit(f"[FAIL] pack_format is {fmt}, expected 48")
          print(f"[ok] pack_format = {fmt}")

          base = "data/rctmod"
          mobs_dir = f"{base}/mobs/trainers/single"
          trainers_dir = f"{base}/trainers"
          dialogs_dir = f"{base}/dialogs/trainers/single"
          adv_dir = f"{base}/advancement/trainers"
          loot_dir = f"{base}/loot_table/trainers/single"
          tex_dir = "assets/rctmod/textures/trainers/single"
          series_dir = f"{base}/series"
          types_dir = f"{base}/trainer_types"

          def ids(d, suffix):
              return {f[:-len(suffix)] for f in os.listdir(d) if f.endswith(suffix)} if os.path.isdir(d) else set()

          mobs = ids(mobs_dir, ".json")
          trainers = ids(trainers_dir, ".json")
          dialogs = ids(dialogs_dir, ".json")
          advs = {i[len("defeat_"):] for i in ids(adv_dir, ".json")}
          if mobs != trainers:
              sys.exit(f"[FAIL] mobs and trainers differ: {sorted(mobs ^ trainers)[:10]}")
          missing_dialog = sorted(mobs - dialogs)
          missing_adv = sorted(mobs - advs)
          if missing_dialog or missing_adv:
              sys.exit(f"[FAIL] missing dialogs {missing_dialog[:10]} or advancements {missing_adv[:10]}")
          print(f"[ok] {len(mobs)} trainers, each with mob, team, dialog and defeat advancement")

          # the league also has loot tables and one skin per trainer
          league = {i for i in mobs if i.startswith("steamon_")}
          loot, tex = ids(loot_dir, ".json"), ids(tex_dir, ".png")
          if league - loot or league - tex:
              sys.exit(f"[FAIL] league trainers without loot {sorted(league - loot)} or skin {sorted(league - tex)}")
          print(f"[ok] {len(league)} league trainers with loot tables and skins")

          series_files = ids(series_dir, ".json")
          expected = {"steamon", "steamos_spark", "steamos_relic", "steamos_might"}
          if series_files != expected:
              sys.exit(f"[FAIL] series are {sorted(series_files)}, expected {sorted(expected)}")

          types_available = {"battleground", "champ", "e4", "leader", "ligh_of_ruin", "normal", "rival",
                             "team_galactic", "team_rocket", "team_shadow"} | ids(types_dir, ".json")

          by_series = {s: {} for s in expected}
          for tid in mobs:
              with open(os.path.join(mobs_dir, tid + ".json"), encoding="utf-8") as f:
                  data = json.load(f)
              if data.get("type", "normal") not in types_available:
                  sys.exit(f"[FAIL] {tid}: unknown trainer type {data.get('type')}")
              ser = data.get("series", [])
              if len(ser) != 1 or ser[0] not in expected:
                  sys.exit(f"[FAIL] {tid}: series must be exactly one of {sorted(expected)}, found {ser}")
              by_series[ser[0]][tid] = [r for group in data.get("requiredDefeats", []) for r in group]

          for name, graph in by_series.items():
              if not graph:
                  sys.exit(f"[FAIL] series {name} has no trainer")
              for tid, refs in graph.items():
                  for ref in refs:
                      if ref not in graph:
                          sys.exit(f"[FAIL] {tid} requires '{ref}' which is not in series {name}")
              roots = [t for t, r in graph.items() if not r]
              if len(roots) != 1:
                  sys.exit(f"[FAIL] series {name}: expected one root trainer, found {roots}")
              unlocks = {t: [] for t in graph}
              for t, refs in graph.items():
                  for r in refs:
                      unlocks[r].append(t)
              seen, todo = set(), [roots[0]]
              while todo:
                  n = todo.pop()
                  if n in seen:
                      continue
                  seen.add(n)
                  todo.extend(unlocks[n])
              if seen != set(graph):
                  sys.exit(f"[FAIL] series {name}: not connected, unreached {sorted(set(graph) - seen)[:10]}")
              print(f"[ok] series {name}: {len(graph)} trainers, single root '{roots[0]}', fully connected")

          # the lang keys used by the dialogs must exist
          with open("assets/steamon_trainer/lang/en_us.json", encoding="utf-8") as f:
              lang = json.load(f)
          unknown = []
          for tid in sorted(mobs):
              if not tid.startswith("steamon_"):
                  with open(os.path.join(dialogs_dir, tid + ".json"), encoding="utf-8") as f:
                      d = json.load(f)
                  for lines in d.values():
                      for line in lines:
                          key = line.get("translatable") if isinstance(line, dict) else None
                          if key and key not in lang:
                              unknown.append(key)
          if unknown:
              sys.exit(f"[FAIL] {len(unknown)} dialog keys missing in en_us.json, e.g. {unknown[:5]}")
          print("[ok] all dialog lang keys exist")
          PYEOF

      - name: Build zip
        id: build
        run: |
          set -euo pipefail
          ZIP="steamon-trainers.zip"
          rm -f "$ZIP"
          zip -r "$ZIP" pack.mcmeta pack.png data assets -x '*.DS_Store'
          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"
          ls -la "$ZIP"

      - name: Smoke test the zip
        env:
          ZIP_PATH: ${{ steps.build.outputs.zip_path }}
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import zipfile, os, sys

          path = os.environ['ZIP_PATH']
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              bad = z.testzip()
              if bad:
                  sys.exit(f"[FAIL] Corrupt entry in zip: {bad}")
              if 'pack.mcmeta' not in names:
                  sys.exit("[FAIL] pack.mcmeta is not at the root of the zip")
              mobs = [n for n in names if n.startswith('data/rctmod/mobs/trainers/single/') and n.endswith('.json')]
              on_disk = len([f for f in os.listdir('data/rctmod/mobs/trainers/single') if f.endswith('.json')])
              if len(mobs) != on_disk:
                  sys.exit(f"[FAIL] zip has {len(mobs)} mob files, repository has {on_disk}")
              print(f"[ok] pack.mcmeta at the root, {len(mobs)} mob files in the zip")
          PYEOF

      - name: Update stable "latest" GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          ZIP_PATH: ${{ steps.build.outputs.zip_path }}
        run: |
          set -euo pipefail
          ASSET="Steamon-Trainers.zip"
          cp "$ZIP_PATH" "$ASSET"
          NOTES="Always-latest Steamon Trainers datapack. This download link never changes. Current: ${VERSION} (${CHANNEL}). Requires Minecraft 1.21.1 NeoForge, Cobblemon 1.8.x, RCTMod 0.19.2-beta and RCTAPI. Mega Showdown is needed for the Mega, Tera and Gigantamax trainers."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Steamon Trainers (latest)" --notes "$NOTES"
            gh release upload latest "$ASSET" --clobber
          else
            gh release create latest "$ASSET" --title "Steamon Trainers (latest)" --notes "$NOTES"
          fi
          echo "Stable URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/${ASSET}"

      - name: Publish to Modrinth
        if: vars.MODRINTH_PROJECT_ID != ''
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          ZIP_PATH: ${{ steps.build.outputs.zip_path }}
        run: |
          set -euo pipefail
          if [ -z "${MODRINTH_TOKEN:-}" ]; then
            echo "MODRINTH_TOKEN secret missing: skipping Modrinth publish."; exit 0
          fi

          FEATURED=false
          if [ "$CHANNEL" = "release" ]; then FEATURED=true; fi

          PROJECT_ID="$MODRINTH_PROJECT_ID" NAME="Steamon Trainers $VERSION ($CHANNEL)" \
              VERSION_NUMBER="$VERSION" VERSION_TYPE="$CHANNEL" FEATURED="$FEATURED" \
              ZIP_PATH="$ZIP_PATH" python3 - <<'PYEOF' > /tmp/mr_data.json
          import json, os, re

          changelog = ''
          try:
              text = open('CHANGELOG.md', encoding='utf-8').read()
              m = re.search(r'^## \[' + re.escape(os.environ['VERSION_NUMBER']) + r'\][^\n]*\n(.*?)(?=^## \[|\Z)', text, re.S | re.M)
              changelog = m.group(1).strip() if m else ''
          except OSError:
              pass

          print(json.dumps({
              'name': os.environ['NAME'],
              'version_number': os.environ['VERSION_NUMBER'],
              'changelog': changelog,
              'project_id': os.environ['PROJECT_ID'],
              'dependencies': [
                  {'project_id': 'lRwTUnD7', 'dependency_type': 'required'},
                  {'project_id': 'MdwFAVRL', 'dependency_type': 'required'},
                  {'project_id': 'SszvX85I', 'dependency_type': 'optional'},
              ],
              'game_versions': ['1.21.1'],
              'version_type': os.environ['VERSION_TYPE'],
              'loaders': ['datapack'],
              'featured': os.environ['FEATURED'] == 'true',
              'status': 'listed',
              'file_parts': [os.path.basename(os.environ['ZIP_PATH'])],
          }))
          PYEOF

          HTTP=$(curl -s -o /tmp/mr_resp.json -w "%{http_code}" \
            -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: github.com/Gaspard4i/steamon-trainers" \
            -F "data=@/tmp/mr_data.json;type=application/json" \
            -F "$(basename "$ZIP_PATH")=@${ZIP_PATH};type=application/zip")
          echo "Modrinth HTTP: $HTTP"
          cat /tmp/mr_resp.json
          echo
          if [ "$HTTP" != "200" ]; then exit 1; fi
